[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reo-survivors"
version = "0.1.0"
description = "Vampire Survivors-style roguelike survival game (OOP/SOLID/Patterns) built with pygame-ce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pygame-ce==2.5.5",
]

[project.scripts]
reo-survivors = "reo_survivors.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

